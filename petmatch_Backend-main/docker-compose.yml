# Solo el API. El stack completo (web + nginx + API) está en ../docker-compose.yml
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petmatch_backend_standalone
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./app:/app/app
    restart: unless-stopped
